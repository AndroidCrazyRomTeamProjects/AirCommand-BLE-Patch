name: AirCommand patcher


on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Installing Apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.7.0.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool_2.7.0.jar /usr/local/bin/apktool.jar
      - name: Download One ui 7 Aircommand apk and the mappings
        run: |
          wget https://github.com/AndroidCrazyRomTeamProjects/ReNote-Rom/raw/refs/heads/fifteen/prebuilts/samsung/pa3qxxx/system/priv-app/AirCommand/AirCommand.apk
          wget https://raw.githubusercontent.com/AndroidCrazyRomTeamProjects/one-ui-7-mappings/refs/heads/master/aircommand_7.6.34.7_mappings.txt
      - name: Decompiling and patching Aircommand
        run: |
           sudo chmod +x ./patch.sh
           ./patch.sh
      - name: Signing the patched Apk with ReNote Platform key
        env:
          RENOTE_PLATFORM_JKS: ${{ secrets.RENOTE_PLATFORM_JKS }}
          RENOTE_KEYSTORE_PASSWORD: ${{ secrets.RENOTE_KEYSTORE_PASSWORD }}
          RENOTE_KEY_ALIAS: ${{ secrets.RENOTE_KEY_ALIAS }}
          RENOTE_KEY_ALIAS_PASSWORD: ${{ secrets.RENOTE_KEY_ALIAS_PASSWORD }}
        run: |
          echo "$RENOTE_PLATFORM_JKS" | base64 --decode > renote_platform.jks
            jarsigner -verbose -keystore renote_platform.jks -storepass "$RENOTE_KEYSTORE_PASSWORD" -keypass "$RENOTE_KEY_ALIAS_PASSWORD" AirCommand_patched.apk "$RENOTE_KEY_ALIAS"
      - name: Upload the patched apk to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID_RENOTE: ${{ secrets.GOFILE_FOLDER_ID_RENOTE }}
        run: |
          echo "Uploading patched apk to GoFile..."
          curl -X POST https://upload.gofile.io/uploadfile \
            -H "Authorization: Bearer ${{ secrets.GOFILE_TOKEN }}" \
            -F "file=@AirCommand_patched.apk" \
            -F "folderId=${{ secrets.GOFILE_FOLDER_ID_RENOTE }}"